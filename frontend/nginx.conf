# Serves the built bundle. It does not proxy /api — the gateway in front does
# that, so this container has no reason to know the backend exists.
#
# The security headers are repeated in every location block on purpose.
# nginx's add_header does not merge across levels: a location that sets any
# add_header of its own discards every add_header inherited from the server
# block. Setting the CSP once at server level and a Cache-Control in
# `location = /index.html` therefore serves the app page with no CSP at all —
# which is exactly the page that needs one, and it fails silently.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No CDNs, no analytics, no fonts from elsewhere. The policy says so as
    # well as the network, because a policy is checkable from a browser and a
    # reviewer should not have to take the network's word for it.
    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /_frontend/health {
        access_log off;
        default_type text/plain;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        return 200 "frontend ok\n";
    }

    # Hashed filenames, so these can be cached hard and forever.
    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a rebuilt UI keeps serving the
    # previous bundle's asset names and the page breaks after a deploy.
    location = /index.html {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
    }

    # History-mode routing: every unknown path is a Vue route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
