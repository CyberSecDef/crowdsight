# CrowdSight gateway — the single ingress into the sealed network.
#
# Upstreams are resolved at request time through Docker's embedded resolver
# rather than at startup. nginx would otherwise refuse to boot whenever an
# upstream is absent, and `frontend` is profile-gated until Phase 9.

resolver 127.0.0.11 valid=10s ipv6=off;

# --- UI + API on :8080 ------------------------------------------------------
server {
    listen 8080;
    server_name _;

    # Large enough for the 50 MB document cap, plus headroom.
    client_max_body_size 64M;

    # Simulation runs are long; report generation on a local 14b model can sit
    # for minutes on a single request. Do not let the proxy time out first.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 10s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /_gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_intercept_errors on;
        error_page 502 503 504 = @placeholder;
    }

    # Shown until Phase 9 builds the frontend, or if it is simply not running.
    location @placeholder {
        root /usr/share/nginx/html;
        try_files /_placeholder.html =503;
        default_type text/html;
    }
}

# --- Direct API access on :5000 --------------------------------------------
# The frontend does not use this; it exists so curl, the test suite and
# `python -m app.config`-style tooling can reach the API without going through
# the UI origin.
server {
    listen 5000;
    server_name _;

    client_max_body_size 64M;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 10s;

    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
    }
}
