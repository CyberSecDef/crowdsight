# CrowdSight gateway — the single ingress into the sealed network.
#
# Upstreams are resolved at request time through Docker's embedded resolver
# rather than at startup. nginx would otherwise refuse to boot whenever an
# upstream is absent, and `frontend` is profile-gated until Phase 9.

resolver 127.0.0.11 valid=10s ipv6=off;

# No reason to announce the version to anything that connects.
server_tokens off;

# Headers for API responses. The frontend container sets its own for the UI;
# these cover what the gateway proxies, which the frontend never sees.
#
# nosniff is the one that matters most here. /api/report/<id>/export?format=html
# returns a document built around agent-written post content — escaped at the
# renderer (Phase 8 Step 3), but a browser that MIME-sniffs its way to a
# different content type is a second chance at the same mistake.
#
# The report export is self-contained: one <style> block, no scripts, no
# external references. So `default-src 'none'` with inline styles allowed fits
# it exactly, and leaves JSON responses maximally constrained.
map $host $api_csp {
    default "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

# --- UI + API on :8080 ------------------------------------------------------
server {
    listen 8080;
    server_name _;

    # Large enough for the 50 MB document cap, plus headroom.
    client_max_body_size 64M;

    # Simulation runs are long; report generation on a local 14b model can sit
    # for minutes on a single request. Do not let the proxy time out first.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 10s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /_gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location /api/ {
        # The backend sets these too. Hide its copies first, or every
        # response carries two of each — and two different CSPs are enforced
        # as their intersection, which is a confusing way to break a page.
        # nginx wins so that responses the backend never produced are covered
        # as well: a 502 when it is down is an nginx error page.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy $api_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_intercept_errors on;
        error_page 502 503 504 = @placeholder;
    }

    # Shown until Phase 9 builds the frontend, or if it is simply not running.
    location @placeholder {
        root /usr/share/nginx/html;
        try_files /_placeholder.html =503;
        default_type text/html;
    }
}

# --- Direct API access on :5000 --------------------------------------------
# The frontend does not use this; it exists so curl, the test suite and
# `python -m app.config`-style tooling can reach the API without going through
# the UI origin.
server {
    listen 5000;
    server_name _;

    client_max_body_size 64M;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 10s;

    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        # The backend sets these too. Hide its copies first, or every
        # response carries two of each — and two different CSPs are enforced
        # as their intersection, which is a confusing way to break a page.
        # nginx wins so that responses the backend never produced are covered
        # as well: a 502 when it is down is an nginx error page.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy $api_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
    }
}
