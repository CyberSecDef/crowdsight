[pytest]
testpaths = tests
addopts = -ra --strict-markers
pythonpath = .

# No global PerimeterWarning filter: pytest resolves filterwarnings classes
# before sys.path is arranged, so `app.config.PerimeterWarning` cannot be
# imported that early. Tests assert on the warning explicitly instead.

markers =
    integration: needs live local services (Ollama, Neo4j) or a running stack
    egress: proves the sealed-network property; must never be skipped to pass

# The fast unit suite is `pytest -m "not integration"`. The egress tests are
# deliberately NOT deselected by default: a test that quietly skips itself
# when it cannot verify the seal is worse than no test at all.
