[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto

# `integration` is deselected by default so the unit loop stays fast and needs
# no running services. `egress` is deliberately NOT deselected: proving the
# sealed network has no route off-host costs nothing and must not become
# something you have to remember to ask for.
addopts = -ra --strict-markers -m "not integration"

# No global PerimeterWarning filter: pytest resolves filterwarnings classes
# before sys.path is arranged, so `app.config.PerimeterWarning` cannot be
# imported that early. Tests assert on the warning explicitly instead.

markers =
    integration: needs live local services (Neo4j). Run with `pytest -m integration`.
    egress: proves the sealed-network property; must never be skipped to pass

# pytest                 -> unit + egress, no services required
# pytest -m integration  -> Neo4j-backed tests, needs `docker compose up -d neo4j`
# pytest -m ""           -> everything
